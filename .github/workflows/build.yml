name: Build VoidLink IPA

on:
  push:
    branches: [ "feat/frame_pacing_metal", "random-interval" ]
  workflow_dispatch:
    inputs:
      runner:
        description: "macOS runner image"
        default: "macos-latest"

jobs:
  build:
    name: Build VoidLink IPA
    runs-on: ${{ inputs.runner || 'macos-latest' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Checkout submodules
        run: "git submodule update --init --recursive"

      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          NEWEST=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $NEWEST"
          sudo xcode-select -s "$NEWEST"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos

      - name: Build VoidLink
        run: |
          xcodebuild -verbose -scheme VoidLink -sdk iphoneos -configuration Debug archive -archivePath $PWD/build/VoidLink.xcarchive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED="NO" CODE_SIGN_ENTITLEMENTS="" CODE_SIGNING_ALLOWED="NO"
          mkdir -p ./build/IPA && mkdir -p ./build/IPA/Payload
          cp -r ./build/VoidLink.xcarchive/Products/Applications/VoidLink.app ./build/IPA/Payload/VoidLink.app
          cd ./build/IPA && zip -r ../../build/VoidLink.ipa ./Payload/* && cd ../..

      # GitHub's Macs have no Xcode 27 yet. iOS 27 devices run apps linked against an older
      # SDK in a compatibility (letterboxed) mode, so this makes a second IPA whose executable
      # reports the iOS 27.2 SDK. The code is identical; only the SDK version field changes.
      - name: Make SDK 27.2 variant
        run: |
          APP=./build/IPA/Payload/VoidLink.app
          BIN="$APP/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          MINOS=$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist")
          echo "Before:"; xcrun vtool -show-build "$BIN" | head -8
          xcrun vtool -set-build-version ios "$MINOS" 27.2 -replace -output "$BIN.patched" "$BIN"
          mv "$BIN.patched" "$BIN"
          /usr/libexec/PlistBuddy -c 'Set :DTPlatformVersion 27.2' -c 'Set :DTSDKName iphoneos27.2' "$APP/Info.plist"
          echo "After:"; xcrun vtool -show-build "$BIN" | head -8
          cd ./build/IPA && zip -r ../../build/VoidLink-sdk27.ipa ./Payload/* && cd ../..

      - name: Upload VoidLink IPA to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VoidLink.ipa
          path: build/VoidLink.ipa

      - name: Upload SDK 27.2 variant
        uses: actions/upload-artifact@v4
        with:
          name: VoidLink-sdk27.ipa
          path: build/VoidLink-sdk27.ipa